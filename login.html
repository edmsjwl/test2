<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인</title>
<style>
  :root {
    --color-primary: #0066cc;
    --color-primary-focus: #0071e3;
    --color-ink: #1d1d1f;
    --color-ink-muted-80: #333333;
    --color-ink-muted-48: #7a7a7a;
    --color-hairline: #e0e0e0;
    --color-divider-soft: #f0f0f0;
    --color-canvas: #ffffff;
    --color-canvas-parchment: #f5f5f7;
    --color-surface-pearl: #fafafc;
    --color-on-primary: #ffffff;

    --radius-sm: 8px;
    --radius-lg: 18px;
    --radius-pill: 9999px;

    --space-xxs: 4px;
    --space-xs: 8px;
    --space-sm: 12px;
    --space-md: 17px;
    --space-lg: 24px;
    --space-xl: 32px;
    --space-xxl: 48px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--color-canvas-parchment);
    font-family: "SF Pro Text", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    color: var(--color-ink);
    padding: var(--space-lg);
  }

  .login-card {
    width: 100%;
    max-width: 380px;
    background-color: var(--color-canvas);
    border-radius: var(--radius-lg);
    padding: var(--space-xxl) var(--space-xl);
  }

  .login-header {
    text-align: center;
    margin-bottom: var(--space-xxl);
  }

  .login-title {
    font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.14;
    letter-spacing: -0.374px;
    margin: 0 0 var(--space-xs);
  }

  .login-subtitle {
    font-size: 14px;
    font-weight: 400;
    line-height: 1.43;
    letter-spacing: -0.224px;
    color: var(--color-ink-muted-48);
    margin: 0;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: var(--space-sm);
  }

  .field-label {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.29;
    letter-spacing: -0.224px;
    color: var(--color-ink-muted-80);
    margin-bottom: var(--space-xxs);
    display: block;
  }

  .text-input {
    width: 100%;
    height: 44px;
    padding: 12px 20px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--color-hairline);
    background-color: var(--color-canvas);
    color: var(--color-ink);
    font-family: inherit;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.374px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .text-input::placeholder {
    color: var(--color-ink-muted-48);
  }

  .text-input:focus {
    border-color: var(--color-primary-focus);
    box-shadow: 0 0 0 2px rgba(0, 113, 227, 0.15);
  }

  .field {
    margin-bottom: var(--space-xs);
  }

  .form-meta {
    display: flex;
    justify-content: flex-end;
    margin: calc(var(--space-xxs) * -1) 0 var(--space-sm);
  }

  .text-link {
    background: transparent;
    border: none;
    padding: 0;
    color: var(--color-primary);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.224px;
    text-decoration: none;
    cursor: pointer;
  }

  .text-link:hover {
    text-decoration: underline;
  }

  .button-primary {
    width: 100%;
    height: 44px;
    background-color: var(--color-primary);
    color: var(--color-on-primary);
    border: none;
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-size: 17px;
    font-weight: 400;
    letter-spacing: -0.374px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .button-primary:active {
    transform: scale(0.95);
  }

  .button-primary:focus-visible {
    outline: 2px solid var(--color-primary-focus);
    outline-offset: 2px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    margin: var(--space-lg) 0;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background-color: var(--color-divider-soft);
  }

  .divider-label {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: -0.12px;
    color: var(--color-ink-muted-48);
  }

  .button-google {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    background-color: var(--color-surface-pearl);
    color: var(--color-ink-muted-80);
    border: 1px solid var(--color-hairline);
    border-radius: var(--radius-pill);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.224px;
    cursor: pointer;
    transition: transform 0.1s ease, background-color 0.15s ease;
  }

  .button-google:hover {
    background-color: var(--color-canvas-parchment);
  }

  .button-google:active {
    transform: scale(0.95);
  }

  .button-google:focus-visible {
    outline: 2px solid var(--color-primary-focus);
    outline-offset: 2px;
  }

  .button-google svg {
    flex-shrink: 0;
  }

  .signup-row {
    text-align: center;
    margin-top: var(--space-xl);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: -0.224px;
    color: var(--color-ink-muted-48);
  }

  .signup-row .text-link {
    font-weight: 600;
  }

  @media (max-width: 419px) {
    .login-card {
      padding: var(--space-xl) var(--space-lg);
      border-radius: var(--radius-sm);
    }

    .login-title {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

  <main class="login-card">
    <div class="login-header">
      <h1 class="login-title">로그인</h1>
      <p class="login-subtitle">계정에 로그인하고 계속하세요</p>
    </div>

    <form>
      <div class="field">
        <label class="field-label" for="email">이메일</label>
        <input class="text-input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label" for="password">비밀번호</label>
        <input class="text-input" type="password" id="password" name="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
      </div>

      <div class="form-meta">
        <a class="text-link" href="#">비밀번호를 잊으셨나요?</a>
      </div>

      <button class="button-primary" type="submit">로그인</button>
    </form>

    <div class="divider">
      <span class="divider-label">또는</span>
    </div>

    <button class="button-google" type="button" id="google-signin">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.616z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.167 6.656 3.58 9 3.58z"/>
      </svg>
      Google로 계속하기
    </button>

    <p class="signup-row">
      계정이 없으신가요? <a class="text-link" href="#">회원가입</a>
    </p>
  </main>

</body>
</html>
